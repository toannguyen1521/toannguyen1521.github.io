<script>
const musicWave = document.getElementById('music-wave');
const volumePercent = document.getElementById('volume-percent');
const audio = document.getElementById('bg-music');
const musicBtn = document.getElementById('music-control');
const musicIcon = document.getElementById('music-icon');
const musicText = document.getElementById('music-text');
const volumeSlider = document.getElementById('volume-slider');

// 1. ĐỒNG BỘ TRẠNG THÁI VÀ MỨC ÂM LƯỢNG KHI VỪA TẢI TRANG
window.addEventListener('DOMContentLoaded', () => {
    const musicTime = localStorage.getItem('music_time');
    if (musicTime) audio.currentTime = parseFloat(musicTime);

    const savedVolume = localStorage.getItem('music_volume');
    if (savedVolume !== null) {
        audio.volume = parseFloat(savedVolume);
        volumeSlider.value = savedVolume;
        volumePercent.innerText = Math.round(parseFloat(savedVolume) * 100) + "%";
    } else {
        audio.volume = 0.3;
        volumePercent.innerText = "30%";
    }

    // KIỂM TRA TRẠNG THÁI BẬT/TẮT TỪ TRANG TRƯỚC
    const musicStatus = localStorage.getItem('music_status');
    
    // Nếu trang trước người dùng ĐÃ TẮT nhạc, thì trang này giữ nguyên trạng thái tắt
    if (musicStatus === 'paused') {
        audio.pause();
        updateButtonUI();
    } else {
        // Nếu trang trước đang bật (hoặc lần đầu vào web), tiến hành phát nhạc
        audio.play().then(() => updateButtonUI()).catch(err => {
            const forcePlay = () => {
                audio.play().then(() => updateButtonUI());
                window.removeEventListener('click', forcePlay);
                window.removeEventListener('scroll', forcePlay);
            };
            window.addEventListener('click', forcePlay);
            window.addEventListener('scroll', forcePlay);
        });
    }
});

// 2. XỬ LÝ SỰ KIỆN KÉO THANH ÂM LƯỢNG
volumeSlider.addEventListener('input', (e) => {
    const vol = e.target.value;
    audio.volume = vol;
    localStorage.setItem('music_volume', vol);
    volumePercent.innerText = Math.round(vol * 100) + "%";
    
    if (parseFloat(vol) === 0) {
        musicIcon.innerText = "🔇";
    } else if (!audio.paused) {
        musicIcon.innerText = "🎵";
    }
});

// Hàm cập nhật giao diện chữ
function updateButtonUI() {
    if (audio.paused) {
        musicText.innerText = "Âm nhạc: Đang tắt";
        musicBtn.style.opacity = "0.6";
        musicWave.classList.remove('playing'); 
    } else {
        musicText.innerText = "Âm nhạc: Đang phát";
        musicBtn.style.opacity = "1";
        if (parseFloat(volumeSlider.value) > 0) {
            musicWave.classList.add('playing');
        } else {
            musicWave.classList.remove('playing');
        }
    }
}

// Giữ lại mousedown để mồi quyền chuyển trang mượt mà
document.querySelectorAll('a').forEach(link => {
    link.addEventListener('mousedown', () => {
        localStorage.setItem('music_time', audio.currentTime);
        // Lưu lại trạng thái trước khi bấm chuyển trang
        localStorage.setItem('music_status', audio.paused ? 'paused' : 'playing');
    });
});

audio.addEventListener('timeupdate', () => {
    localStorage.setItem('music_time', audio.currentTime);
});

// Bật tắt nhạc khi click trực tiếp
musicBtn.addEventListener('click', (e) => {
    if (e.target === volumeSlider) return; 
    e.stopPropagation();
    if (audio.paused) {
        audio.play().then(() => {
            updateButtonUI();
            localStorage.setItem('music_status', 'playing'); // Lưu trạng thái ĐANG PHÁT
        });
    } else {
        audio.pause();
        updateButtonUI();
        localStorage.setItem('music_status', 'paused'); // Lưu trạng thái ĐÃ TẮT
    }
});

</script>
